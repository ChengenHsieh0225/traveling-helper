apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:latest
          command: ['sh', '-c', 'until nc -zv rabbitmq-service 5672; do echo waiting for rabbitmq; sleep 2; done;']
      containers:
      - name: auth-service
        image: auth-service:latest 
        imagePullPolicy: Never 
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: traveling-helper-config
        - secretRef:
            name: traveling-helper-secret
        env:
        - name: DB_URL
          value: "jdbc:mysql://mysql-service:3306/auth_prod"
        # Health Check
        readinessProbe:
          httpGet:
            path: /auth/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10