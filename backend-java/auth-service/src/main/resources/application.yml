spring:
  application:
    name: auth

  # Database
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER}

  # Google OAuth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}

  jpa:
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT}
        temp.use_jdbc_metadata_defaults: false

    open-in-view: false

  rabbitmq:
    port: 5672
    host: ${RABBITMQ_URL}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms # wait for 2 seconds before first retry
          multiplier: 2.0 # double the waiting time after each failure

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO