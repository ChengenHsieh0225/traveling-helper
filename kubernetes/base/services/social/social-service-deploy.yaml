apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-service
  template:
    metadata:
      labels:
        app: social-service
    spec:
      containers:
      - name: social-service
        image: social-service:latest 
        imagePullPolicy: Never 
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: traveling-helper-config
        - secretRef:
            name: traveling-helper-secret
        env:
        - name: DB_URL
          value: "jdbc:mysql://mysql-service:3306/social_prod"
        # Health Check
        readinessProbe:
          httpGet:
            path: /api/plans/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10