spring:
  application:
    name: social

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:password}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}

  jpa:
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        temp.use_jdbc_metadata_defaults: false
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms # wait for 2 seconds before first retry
          multiplier: 2.0 # double the waiting time after each failure

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.web: DEBUG